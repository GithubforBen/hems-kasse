spring:
  datasource:
    url: jdbc:h2:mem:kasse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  # NOTE: this H2 setup cannot currently run the migrations. The schema uses two PostgreSQL
  # features H2 has no equivalent for: split_part() in V4, and the partial unique indexes in
  # V5/V14 ("create unique index ... where ..."), which enforce one open shift per Kassette and
  # one Abrechnung per envelope number. SmokeTest therefore fails on context start.
  # Point this datasource at a real PostgreSQL (or wire up Testcontainers) to run the suite:
  #   url: jdbc:postgresql://localhost:5432/kasse_test
  #   driver-class-name: org.postgresql.Driver
  #   dialect: org.hibernate.dialect.PostgreSQLDialect

kasse:
