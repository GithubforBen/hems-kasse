# docker compose up --build
#
# Bring the whole Schulkasse stack up: Postgres + Spring Boot backend + Nuxt frontend.
# Reads secrets from ./.env (copy .env.example first).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kasse}
      POSTGRES_USER: ${POSTGRES_USER:-kasse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kasse}
    volumes:
      - kasse-pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasse} -d ${POSTGRES_DB:-kasse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    image: schulkasse-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # JDBC points at the compose-internal hostname `db`.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kasse}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kasse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kasse}

      KASSE_JWT_SECRET: ${KASSE_JWT_SECRET}
      KASSE_JWT_TTL_HOURS: ${KASSE_JWT_TTL_HOURS:-12}

      KASSE_CLASSES: ${KASSE_CLASSES}
      KASSE_ADMINS: ${KASSE_ADMINS}

      KASSE_EPC_NAME: ${KASSE_EPC_NAME}
      KASSE_EPC_IBAN: ${KASSE_EPC_IBAN}
      KASSE_EPC_BIC: ${KASSE_EPC_BIC:-}
      KASSE_EPC_PURPOSE: ${KASSE_EPC_PURPOSE:-}
      KASSE_EPC_REMITTANCE: ${KASSE_EPC_REMITTANCE:-Kuchenverkauf}

      KASSE_CORS_ORIGINS: ${KASSE_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    image: schulkasse-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # The browser sees this URL, so it must be reachable from the user's machine.
      # When running on a different host, override e.g. NUXT_PUBLIC_API_BASE=https://kasse.example.org
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:${BACKEND_HOST_PORT:-8080}}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  kasse-pgdata:
